<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apps · Niels van der Donk</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='7' height='7' rx='2'/%3E%3Crect x='18' y='7' width='7' height='7' rx='2'/%3E%3Crect x='7' y='18' width='7' height='7' rx='2'/%3E%3Crect x='18' y='18' width='7' height='7' rx='2'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff; --fg: #111111; --muted: #6f6f6f; --line: #e2e2e2; --soft: #f3f3f3; --danger: #b00020;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 10px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --fg: #f1f1f1; --muted: #9a9a9a; --line: #2b2b2b; --soft: #1b1b1b; --danger: #ff6b81; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    main { max-width: 560px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 20px 64px; }
    h1 { font-size: 2.4rem; letter-spacing: -0.02em; margin: 0 0 .2em; }
    h2 { font-size: 1.2rem; margin: 0 0 .3em; }
    p { margin: 0 0 .8em; }
    a { color: inherit; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .label { display: block; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4rem; }
    .error { color: var(--danger); font-weight: 500; }

    .apps { list-style: none; margin: 32px 0; padding: 0; border-top: 1px solid var(--line); }
    .apps li { border-bottom: 1px solid var(--line); }
    .apps li.muted { padding: 14px 0; }
    .app { display: flex; align-items: center; gap: 16px; padding: 14px 0; text-decoration: none; }
    .app img { border-radius: 12px; flex: none; }
    .app-text { display: flex; flex-direction: column; }
    .app-text strong { font-size: 1.15rem; }
    .app-text .muted { font-size: .9rem; }
    .app:hover strong { text-decoration: underline; text-underline-offset: 3px; }

    .card { padding: 20px; background: var(--soft); border-radius: var(--radius); }
    .field { display: block; margin: 0 0 16px; }
    input {
      width: 100%; font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg);
      border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
    }
    input:focus { outline: none; border-color: var(--fg); }
    .btn {
      min-height: 44px; padding: 0 18px; border: 1.5px solid var(--fg); border-radius: var(--radius);
      background: transparent; color: var(--fg); font: inherit; font-size: 1rem; font-weight: 500; cursor: pointer;
    }
    .btn:disabled { opacity: .5; }
    .btn-primary { background: var(--fg); color: var(--bg); }
    .inline { display: flex; gap: 8px; margin: 12px 0 6px; }
    .link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <p class="muted">Small tools, made for us.</p>
    <ul class="apps" id="apps"></ul>
    <section id="account"><p class="muted small">Loading…</p></section>
  </main>
  <script type="module" src="hub.js"></script>
</body>
</html>
